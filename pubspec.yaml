name: uttaranchal_app
description: "Uttaranchal Dairy & Sweets — customer app + shop staff app, connected to the website (Laravel API)."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2                # talks to the Laravel API
  shared_preferences: ^2.3.2  # keeps sign-in, bag and favourites on the phone
  razorpay_flutter: ^1.4.0    # UPI / card payments (same Razorpay account as the website)
  url_launcher: ^6.3.0        # directions, call the shop
  geolocator: ^13.0.2         # "use my current location" for the address
  geocoding: ^3.0.0           # turns the location into pincode / street / city

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/Cormorant-Garamond-normal-500.ttf
          weight: 500
        - asset: assets/fonts/Cormorant-Garamond-normal-600.ttf
          weight: 600
        - asset: assets/fonts/Cormorant-Garamond-normal-700.ttf
          weight: 700
        - asset: assets/fonts/Cormorant-Garamond-italic-500.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Cormorant-Garamond-italic-600.ttf
          weight: 600
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DM-Sans-normal-400.ttf
          weight: 400
        - asset: assets/fonts/DM-Sans-normal-500.ttf
          weight: 500
        - asset: assets/fonts/DM-Sans-normal-600.ttf
          weight: 600
        - asset: assets/fonts/DM-Sans-normal-700.ttf
          weight: 700
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/Noto-Serif-Devanagari-normal-400.ttf
          weight: 400
        - asset: assets/fonts/Noto-Serif-Devanagari-normal-600.ttf
          weight: 600

# ---- Branding (run once via setup script) ----
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFCD45"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFCD45"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#FFCD45"
    image: assets/icon/splash_logo.png
  ios: true
  android: true
  web: false
